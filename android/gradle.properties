# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# Raised from the 2g default: the native build (whisper + sherpa + llama) OOMs below this.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# ABIs to build. Dev default: arm64-v8a only — the C++ core (whisper/sherpa/llama)
# is compiled once per ABI, so this is ~3x faster than building all of them and it
# matches every modern test device. Override from the CLI for a store release:
#   ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
reactNativeArchitectures=arm64-v8a

# Origin for the ~114 MB of models fetched on first run (plus 1.1 GB if the writer model is
# taken). They are deliberately NOT in the APK — an app that shipped 1.4 GB of weights would lose
# most of its installs at the store's size warning.
#
# Empty = fetch from upstream (GitHub, Hugging Face), which is the development default and not
# something to ship: those URLs are outside our control and put first-run success on a third
# party's uptime. Set it to a host serving the files under /models/v1/<filename>, using the
# filenames in ModelCatalog:
#   ./gradlew assembleRelease -PmodelBaseUrl=https://verbale.innocorelabs.com
#
# It points at the licence server's own host, which is a VPS in Mumbai — the same box, so one
# certificate and one thing to watch, and near the users this app is built for. Upstream stays as
# the fallback, so an outage there degrades to slow rather than broken, and every file is
# sha256-verified against the catalog from either source, so a mirror cannot substitute a
# different file undetected. Fill it with server/deploy/mirror-models.sh.
#
# It also means first run stops announcing itself to GitHub and Hugging Face, which for an app
# whose whole promise is that nothing leaves your phone was a wart.
modelBaseUrl=https://verbale.innocorelabs.com

# The licence server's ECDSA P-256 public key, base64 X.509.
#
# PUBLIC, and safe in the repository: it only verifies tokens, it cannot mint one. The signing
# half was generated on the licence server and has never left it.
#
# PERMANENT. It is compiled into every APK, so replacing it makes every installed copy reject
# every token until it updates. There is no rotation story here short of a forced upgrade.
licencePublicKey=MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEVD1+oPXU5SOqKOcBwsixGfssamPBbIxH6f0TkUFPLDX7K3UMWS3p224rL1T/SnbrrBKjbQBazyOJ/5HY1pMkHw==

# Where the app signs in. Empty means sign-in is unavailable, which is the correct state for a
# build with no server behind it rather than a crash on a dead URL.
licenceBaseUrl=https://verbale.innocorelabs.com

# The Play Console subscription id. ONE subscription with two base plans (verbale-pro-1m monthly,
# verbale-pro-12m yearly), not two subscriptions — BillingModule.plans() reads both off this single
# product. The id says "1m" only because Play ids are permanent and this product was first made
# as the monthly one; it carries both plans. Never shown to a user. Base plan and offer ids are
# not referenced anywhere: plans are told apart by billing period, offers by OfferChoice.
playSubscriptionId=verbale_pro_1m

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false
