apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Path to libonnxruntime.so for the build ABI, extracted from the onnxruntime-android AAR.
 *
 * sherpa-onnx needs a real .so to link against and cannot fetch one for Android itself. Rather
 * than downloading a second ONNX Runtime — which would put two different builds of it in one
 * process — we reuse the exact library Gradle already packages into the APK.
 *
 * Returns "" when the AAR is not in the cache yet; cpp/CMakeLists.txt then skips diarization with
 * a warning rather than failing the build.
 */
// 1.20.0 is the FIRST onnxruntime-android release whose native libs are 16 KB page aligned.
// 1.19.2 shipped LOAD segments aligned to 0x1000, which fails Android's 16 KB compatibility check
// and is a Play Store blocker (required for apps targeting Android 15+ since Nov 2025). Every
// other .so in this APK — ours and React Native's — was already 0x4000; onnxruntime was the only
// offender, so this is the whole fix.
//
// Note the symbols are VERSIONED: 1.19.2 exports OrtGetApiBase@@VERS_1.19.2 and 1.20.0 exports
// @@VERS_1.20.0, so libaudionotes.so must be RELINKED against the new AAR, not just repackaged
// with it — a swapped .so alone would fail to resolve at load time. Prefab handles that as long
// as the native build is not served stale from cache.
//
// Deliberately the smallest jump that clears the check: the pipeline is validated on 1.19.x, and
// our vendored headers are ORT_API_VERSION 19, which a 1.20 runtime still serves (ORT keeps
// older API versions working). Moving further is a separate change with its own validation.
ext.ortVersion = "1.20.0"

String ortSharedLibPath() {
    def abi = (project.findProperty("reactNativeArchitectures") ?: "arm64-v8a").split(",")[0].trim()
    // Cache path is scoped BY VERSION. It used to be "ort-extracted/${abi}/libonnxruntime.so",
    // which the early-return below then treated as a valid hit forever — so bumping ortVersion
    // silently kept linking the previously extracted library. That cost a confusing debugging
    // round: the new AAR downloaded, the build reported success, and the APK still shipped the
    // old .so with the old versioned symbols.
    def out = new File(project.layout.buildDirectory.get().asFile,
        "ort-extracted/${project.ext.ortVersion}/${abi}/libonnxruntime.so")
    if (out.exists() && out.length() > 0) return out.absolutePath

    // Locate the AAR on disk rather than resolving a configuration: this runs while
    // defaultConfig is being evaluated, and resolving there locks the dependency set before
    // the dependencies {} block has been read ("Cannot mutate the dependencies of
    // configuration ':app:implementation' after ... was resolved").
    def cacheDir = new File(project.gradle.gradleUserHomeDir,
        "caches/modules-2/files-2.1/com.microsoft.onnxruntime/onnxruntime-android/${project.ext.ortVersion}")
    if (!cacheDir.isDirectory()) return ""
    def aar = null
    cacheDir.eachFileRecurse { if (it.name.endsWith(".aar")) aar = it }
    if (aar == null) return ""

    out.parentFile.mkdirs()
    def found = false
    new java.util.zip.ZipFile(aar).withCloseable { zip ->
        def entry = zip.getEntry("jni/${abi}/libonnxruntime.so")
        if (entry != null) {
            out.withOutputStream { os -> zip.getInputStream(entry).withCloseable { it.transferTo(os) } }
            found = true
        }
    }
    return found ? out.absolutePath : ""
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    packaging {
        jniLibs {
            // Drop the onnxruntime JAVA binding. We drive onnxruntime entirely from C++ — via
            // dlopen in util/ort_init.cpp and statically-linked sherpa-onnx — and nothing in this
            // app references ai.onnxruntime, so its .so is loaded by nothing and only adds weight.
            //
            // It also happens to be the last library failing Android's 16 KB page-size check:
            // onnxruntime-android aligned libonnxruntime.so at 1.20.0 but did not align this one
            // until 1.23. Excluding an unused library beats bumping three more minor versions to
            // fix code we never call.
            //
            // libonnxruntime.so itself is ALSO kept out of the APK: at 17 MB it was the single
            // biggest payload, so it downloads on first run instead (ModelCatalog "onnxruntime-lib").
            // NativeBridge.ensureLoaded() System.load()s it from filesDir before libaudionotes.so,
            // which satisfies that library's DT_NEEDED and the RTLD_GLOBAL dlopen in ort_init.cpp.
            excludes += ['**/libonnxruntime4j_jni.so', '**/libonnxruntime.so']
        }
    }

    sourceSets {
        androidTest {
            // Serve cpp/tests/golden/ straight into the instrumentation APK's assets rather than
            // copying it. MinutesParityTest replays the SAME files the C++ test_minutes replays,
            // so the device and the desktop core are checked against one artifact — a copy here
            // could drift, which is the exact failure the shared core exists to prevent.
            assets.srcDirs += ["$rootDir/../cpp/tests/golden"]
        }
    }

    namespace "com.audionotes"
    defaultConfig {
        applicationId "com.audionotes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Lets `./gradlew connectedDebugAndroidTest` exercise the C++ core (VAD/ASR/diarize)
        // directly on a device, with no UI driving and no dependence on the logcat buffer.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Origin for the first-run model download. The weights are not in the APK — see
        // ModelCatalog.sourcesFor. Empty means "fetch from upstream (GitHub / Hugging Face)",
        // which is the development default; set `modelBaseUrl` in gradle.properties, or pass
        // -PmodelBaseUrl=https://cdn.example.com on the release build, to serve them yourself.
        buildConfigField "String", "MODEL_BASE_URL",
            "\"${project.findProperty('modelBaseUrl') ?: ''}\""

        // The licence server's ECDSA P-256 public key, base64 X.509 — see billing/Licence.kt.
        // Empty is the safe default and the development one: with no key, no token can verify,
        // so every build without it treats everyone as a free user rather than as a subscriber.
        // Set `licencePublicKey` in gradle.properties, or -PlicencePublicKey= on the release
        // build. This is a PUBLIC key; the signing half never leaves the licence server.
        buildConfigField "String", "LICENCE_PUBLIC_KEY",
            "\"${project.findProperty('licencePublicKey') ?: ''}\""

        // Where the licence server lives. Empty means sign-in is unavailable, which is the
        // correct state for a build with no server behind it rather than a crash on a dead URL.
        buildConfigField "String", "LICENCE_BASE_URL",
            "\"${project.findProperty('licenceBaseUrl') ?: ''}\""

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // sherpa-onnx cannot download an ONNX Runtime for Android (its
                // download_onnxruntime() fatal-errors on anything but Linux/macOS/Windows), so we
                // hand it the exact libonnxruntime.so that ships in the APK. Resolved lazily:
                // the AAR is only unzipped when a build actually runs, and if sherpa-onnx is not
                // vendored this stays empty and CMake simply skips diarization.
                arguments "-DORT_AAR_SO=" + ortSharedLibPath()
            }
        }
        ndk {
            // Driven by `reactNativeArchitectures` in gradle.properties. The C++ core
            // (whisper/sherpa/llama) is compiled once per ABI, so building only the
            // ABI of your test device cuts native build time roughly 3x. Override for
            // a release build:  ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
            abiFilters(*project.property("reactNativeArchitectures").split(",").collect { it.trim() })
        }
    }

    // App JNI: builds libappmodules.so (RN New-Arch registration) AND our shared
    // C++ core libaudionotes.so. See src/main/jni/CMakeLists.txt.
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // onnxruntime-android exposes its native libs/headers to CMake via prefab.
    buildFeatures {
        prefab true
        buildConfig true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The upload key. Deliberately configured from properties that live OUTSIDE this repo —
        // ~/.gradle/gradle.properties on a developer machine, or CI secrets — so the keystore and
        // its passwords are never a git object. See docs/release-signing.md.
        //
        // Guarded by findProperty rather than assumed: Gradle configures this block on every
        // invocation, including a plain debug build on a machine that has never seen the key.
        release {
            if (project.findProperty('AUDIONOTES_STORE_FILE')) {
                storeFile file(project.property('AUDIONOTES_STORE_FILE'))
                storePassword project.property('AUDIONOTES_STORE_PASSWORD')
                keyAlias project.property('AUDIONOTES_KEY_ALIAS')
                keyPassword project.property('AUDIONOTES_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Falls back to the debug key ONLY so that a release-flavoured build is still
            // possible locally for measuring size or startup. Shipping one that way is what the
            // task-graph guard below exists to prevent: Play rejects a debug-signed upload, and
            // an unnoticed debug-signed AAB is a wasted submission round trip.
            signingConfig project.findProperty('AUDIONOTES_STORE_FILE')
                ? signingConfigs.release
                : signingConfigs.debug

            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// A release with no licence key is an app that hands the paid tier to everyone. LicenceStore
// treats a missing key as "licensing is not wired up yet" and unlocks — the right failure for a
// development build, a silent giveaway in a shipped one. Caught here rather than in the store
// listing.
//
// Against the task graph rather than inside buildTypes.release: that block is configured on every
// invocation, so a check placed there fails debug builds as well.
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { t ->
        t.project == project && t.name ==~ /(?i)(assemble|bundle|install)Release/
    }
    if (!releasing) return

    if (!project.findProperty('licencePublicKey')) {
        throw new GradleException(
            "No licencePublicKey set — a release built this way unlocks the paid tier for " +
            "everyone. Pass -PlicencePublicKey=<base64 X.509 P-256 public key>, or set it in " +
            "android/gradle.properties.")
    }

    // A debug-signed release is not a release. Play rejects the upload, and finding that out at
    // submission costs a round trip; worse, a debug-signed APK handed to a tester establishes a
    // signature that the real one cannot replace without an uninstall.
    //
    // Opt out consciously for a local size or startup measurement — the flag has to be typed,
    // which is the point.
    if (!project.findProperty('AUDIONOTES_STORE_FILE') &&
        !project.findProperty('allowDebugSignedRelease')) {
        throw new GradleException(
            "Release signing is not configured, so this build would be signed with the DEBUG " +
            "key and Play would reject it. Set AUDIONOTES_STORE_FILE / _STORE_PASSWORD / " +
            "_KEY_ALIAS / _KEY_PASSWORD in ~/.gradle/gradle.properties — see " +
            "docs/release-signing.md. For a throwaway local build, pass " +
            "-PallowDebugSignedRelease=true.")
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // AudioNotes milestone 1
    //
    // Pinned at 1.17.0, not 1.13.1, and deliberately: the recording notification uses
    // NotificationCompat.setRequestPromotedOngoing / setShortCriticalText and
    // NotificationManagerCompat.canPostPromotedNotifications, none of which exist before 1.17.
    // The build only compiled at 1.13.1 because React Native happened to drag 1.17.0 in
    // transitively — so a React Native version bump could have silently removed them.
    implementation("androidx.core:core-ktx:1.17.0")
    // ExploreByTouchHelper, which is what makes the Canvas-drawn floating bubble reachable by
    // TalkBack. Declared rather than relied on transitively, for the same reason as core above.
    implementation("androidx.customview:customview:1.1.0")
    implementation("com.microsoft.onnxruntime:onnxruntime-android:${project.ext.ortVersion}") // Silero VAD (MIT), prefab
    implementation("net.zetetic:sqlcipher-android:4.6.1")                  // encrypted storage
    implementation("androidx.sqlite:sqlite:2.4.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test:rules:1.6.1")

    testImplementation("junit:junit:4.13.2") // local JVM unit tests (testDebugUnitTest)
}
