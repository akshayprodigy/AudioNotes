buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Uploads the R8 mapping and the native (C++/JNI) debug symbols so a crash report is a
        // stack trace rather than a column of hex addresses. Inert without SENTRY_AUTH_TOKEN.
        classpath("io.sentry:sentry-android-gradle-plugin:5.8.0")
    }
}

apply plugin: "com.facebook.react.rootproject"
