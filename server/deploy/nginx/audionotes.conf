# nginx site for the licence server.
#
# Install to /etc/nginx/sites-available/<host> and symlink into sites-enabled. Follows the shape of
# the other sites on this machine: a redirect from 80, TLS from certbot on 443, and a proxy to a
# container listening on localhost.
#
# Replace AUDIONOTES_HOSTNAME throughout, or let deploy/setup-nginx.sh do it.

# Rate limits, declared at http level (this file is included inside it).
#
# These are password endpoints on the public internet. Without a limit, an account's password is
# only as strong as how fast someone can guess it, and nothing else in the stack is counting.
limit_req_zone $binary_remote_addr zone=audionotes_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=audionotes_general:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name AUDIONOTES_HOSTNAME;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name AUDIONOTES_HOSTNAME;

    ssl_certificate     /etc/letsencrypt/live/AUDIONOTES_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/AUDIONOTES_HOSTNAME/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Nothing here takes an upload. The largest body is a Razorpay webhook.
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    # Sign-in, sign-up and the account page: slow enough that guessing a password over the network
    # is hopeless, generous enough that a person mistyping theirs never notices.
    location ~ ^/(api/account/|account$|signup$|devices/forget$|subscribe$) {
        limit_req zone=audionotes_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Razorpay's webhook. Deliberately not rate limited: it retries on any non-2xx, and a 429 here
    # would turn a burst of renewals into a queue of subscriptions we never marked paid.
    #
    # The signature is an HMAC over the raw body, so nothing may rewrite it on the way through.
    location = /api/billing/webhook {
        proxy_pass         http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
    }

    location / {
        limit_req zone=audionotes_general burst=20 nodelay;
        proxy_pass         http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
