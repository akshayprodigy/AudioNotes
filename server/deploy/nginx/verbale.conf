# nginx site for the licence server.
#
# Install to /etc/nginx/sites-available/<host> and symlink into sites-enabled. Follows the shape of
# the other sites on this machine: a redirect from 80, TLS from certbot on 443, and a proxy to a
# container listening on localhost.
#
# Replace VERBALE_HOSTNAME throughout, or let deploy/setup-nginx.sh do it.

# Rate limits, declared at http level (this file is included inside it).
#
# These are password endpoints on the public internet. Without a limit, an account's password is
# only as strong as how fast someone can guess it, and nothing else in the stack is counting.
limit_req_zone $binary_remote_addr zone=verbale_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=verbale_general:10m rate=60r/m;

# Concurrency limits for the model mirror below. Two zones, because they answer different
# questions: one phone must not open twenty connections, AND the mirror as a whole must not eat
# the uplink this machine's five other sites are sharing. The second is keyed on $server_name,
# which is constant here — that is the trick for a global counter rather than a per-client one.
limit_conn_zone $binary_remote_addr zone=verbale_models_ip:10m;
limit_conn_zone $server_name        zone=verbale_models_all:1m;

server {
    listen 80;
    listen [::]:80;
    server_name VERBALE_HOSTNAME;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name VERBALE_HOSTNAME;

    ssl_certificate     /etc/letsencrypt/live/VERBALE_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VERBALE_HOSTNAME/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Nothing here takes an upload. The largest body is a sign-in form.
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    # The only two doors with a password behind them: the app's sign-in API, and the admin
    # console. Slow enough that guessing over the network is hopeless, generous enough that a
    # person mistyping theirs never notices.
    #
    # The app rate-limits /admin/signin as well; this is the cheaper outer layer, and it is the one
    # door in the building that opens onto the customer list.
    location ~ ^/(api/account/|admin/signin$) {
        limit_req zone=verbale_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # The first-run model download — the mirror half of ModelCatalog.sourcesFor.
    #
    # ~1.4 GB of weights served off this box rather than a CDN. It is in Mumbai, which is where the
    # users this app is built for actually are; it has the disk spare and has moved 3.5 GB in its
    # first eighteen weeks; and it is one fewer account standing between a launch and a first run.
    # If egress ever becomes the constraint, MODEL_BASE_URL is one gradle property and the layout
    # here is the layout an object store wants.
    location /models/v1/ {
        root /srv/verbale-models;

        # Deliberately NOT in the verbale_general request zone: that zone exists to make password
        # guessing hopeless, and these are a handful of very large GETs from an app that is not
        # signing in. Rate-limiting them by request count would do nothing useful and would break
        # a resumed download.
        #
        # What does apply is bandwidth, because the licence API lives on this same machine and a
        # phone pulling 1.1 GB of weights must never be why someone else's sign-in times out.
        limit_rate       3m;   # per connection; ~6 min for the LLM, ~40 s for the free set
        limit_rate_after 2m;   # let a small file finish at full speed before throttling
        limit_conn verbale_models_ip   4;
        limit_conn verbale_models_all 24;

        # Hitting that global cap returns 503 — which is the good outcome, not the bad one.
        # ModelManagerModule.fetchTo treats any non-2xx as "this source failed" and falls through
        # to the upstream URL, so a saturated mirror degrades to a slower download from GitHub or
        # Hugging Face. Nobody sees an error. That fallback is what makes it safe to set the cap
        # low enough to actually protect the API.
        limit_conn_status 503;

        # Byte-range resume, which is load-bearing rather than a nicety: the downloader sends
        # `Range: bytes=N-` into a .part file and starts over from zero if the reply is not a 206.
        # On a 1.1 GB file over mobile data that is the difference between eventually finishing and
        # never finishing. nginx does this for static files by default — but gzip silently
        # disables it, and gzip is on at server level, so turning it off here is the whole point.
        gzip off;

        # Immutable by construction: which bytes belong at a filename is pinned by the sha256 in
        # ModelCatalog, so a changed model is a changed filename (or a /v2/). Worth caching hard
        # for the case that repeats — the same person reinstalling, or a shared office wifi.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # The server-level headers, repeated. This is not redundancy: nginx's add_header is
        # REPLACING, not additive — a location that declares any add_header of its own inherits
        # none of the outer ones. So the Cache-Control line above would, on its own, quietly strip
        # HSTS and nosniff from every model response. nosniff is the one that matters here, these
        # being 1.1 GB of unlabelled binary.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "no-referrer" always;

        # Serve only what the catalog named. No directory listing, no traversal, and a miss is a
        # 404 rather than anything that could be mistaken for a model.
        autoindex off;
        try_files $uri =404;
        default_type application/octet-stream;
    }

    location / {
        limit_req zone=verbale_general burst=20 nodelay;
        proxy_pass         http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
