# The whole deployment: a Python process and a reverse proxy that terminates TLS.
#
# The api container publishes nothing. Caddy is the only way in, which is what makes it safe for
# uvicorn to trust forwarded headers.

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/licences.db
    volumes:
      - licences:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      AUDIONOTES_SITE_ADDRESS: ${AUDIONOTES_SITE_ADDRESS:-:80}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  # The database. Backing this up is backing up everything the server knows.
  licences:
  # Certificates and account keys. Losing this means re-issuing certificates, which Let's Encrypt
  # rate-limits, so it is worth keeping.
  caddy_data:
  caddy_config:
