# The licence server: one Python process and one SQLite volume.
#
# No reverse proxy here. This host already runs nginx on 80/443 in front of several other
# projects, and every one of them binds a container to a localhost port and lets nginx terminate
# TLS. A second proxy trying to take those ports would break the lot, so this follows the
# convention that is already on the machine — see deploy/nginx/.
#
# The port is published on 127.0.0.1 only. Nothing reaches this container except nginx, which is
# what makes it safe for uvicorn to trust forwarded headers.

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/licences.db
    volumes:
      - licences:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-9100}:8787"

volumes:
  # Everything the server knows: accounts, subscriptions, devices. Backing this up is the whole
  # disaster plan — see deploy/backup.sh.
  licences:
